<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#f8faff"/><g font-family="Arial,sans-serif" fill="#15233d"><text x="60" y="66" font-size="14" letter-spacing="3">ELISHA MATANGA / IDENTITY EXPLORATIONS</text><text x="60" y="115" font-size="32">Three directions. One engineering identity.</text></g><g stroke="#d4dfef"><path d="M60 150h1080M420 180v330M800 180v330"/></g><svg x="155" y="210" width="140" height="140" viewBox="0 0 64 64" fill="none"><g stroke="#0078ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M28 31H9c0-8 4-13 11-13s11 5 11 13-4 14-11 14c-5 0-8-2-10-5"/><path d="M31 44V21c0-5 10-5 10 1v22-22c0-6 12-6 12 0v22"/></g></svg><svg x="535" y="210" width="140" height="140" viewBox="0 0 64 64" fill="none"><g stroke="#0078ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 15v15c0 12 11 19 24 19h14"/><path d="M28 15v14c0 7 6 12 13 12h10"/><path d="M43 15v12c0 3 3 6 8 6"/></g></svg><svg x="915" y="210" width="140" height="140" viewBox="0 0 64 64" fill="#0078ff"><path d="M10 12h44v10H20v10h25v10H20v10H10z"/><path d="m33 12 21 20v20H44V36L23 16z"/></svg><g font-family="Arial,sans-serif" fill="#15233d" font-size="21"><text x="75" y="410">01 / Shared stem</text><text x="455" y="410">02 / Confluence — selected</text><text x="835" y="410">03 / Fold</text></g><g font-family="Arial,sans-serif" fill="#52627a" font-size="15"><text x="75" y="445">A custom lowercase em ligature.</text><text x="75" y="470">Readable, friendly, less clear at 16px.</text><text x="455" y="445">Three paths, one considered direction.</text><text x="455" y="470">Open, balanced, clear in monochrome.</text><text x="835" y="445">An E with an intersecting diagonal.</text><text x="835" y="470">Strong silhouette; a denser intersection.</text><text x="60" y="565">Palette reference: Carswafi blue #0078ff. Identity: original personal mark, not Carswafi branding.</text></g></s